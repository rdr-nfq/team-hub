name: Monitor de pases (.vsix y .exe)

# Empaqueta monitor-pases/ como plugin de VS Code (MonitorPases.vsix: el motor en
# Python va dentro y usa el Python de la VDI; no lleva ningún ejecutable) y como
# MonitorPases.exe (para quien pueda ejecutarlo), los prueba en Windows y los
# publica en la release «monitor-pases» del repositorio. Enlaces fijos:
#   https://github.com/rdr-nfq/team-hub/releases/download/monitor-pases/MonitorPases.vsix
#   https://github.com/rdr-nfq/team-hub/releases/download/monitor-pases/MonitorPases.exe

on:
  push:
    branches: [main]
    paths:
      - "monitor-pases/**"
      - ".github/workflows/monitor-pases.yml"
  pull_request:
    paths:
      - "monitor-pases/**"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: monitor-pases-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exe:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: monitor-pases
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pruebas (contra el GitHub simulado)
        run: python -m unittest discover -s pruebas -v

      - name: Compilar MonitorPases.exe
        run: |
          python -m pip install --disable-pip-version-check pyinstaller==6.11.1
          python build/compilar.py

      - name: Probar el .exe (demo, sin navegador)
        run: |
          $p = Start-Process -FilePath (Resolve-Path dist/MonitorPases.exe) -ArgumentList "--demo", "--sin-navegador" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
            Start-Sleep -Seconds 1
            try { $ok = (Invoke-RestMethod http://127.0.0.1:8775/ping -TimeoutSec 2).app -eq "monitor-pases" } catch {}
          }
          if (-not $ok) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; throw "El .exe no ha arrancado" }
          $html = (Invoke-WebRequest http://127.0.0.1:8775/ -UseBasicParsing).Content
          foreach ($f in "app.js", "diffs.js", "comun.js", "entrada.js", "dps.js", "repos.js", "copilot.js", "filtros.js", "paleta.js", "jira.js", "ayuda.js", "manual.md", "estilos.css", "vendor/preact-htm.mjs", "fonts/lato-400.woff2") {
            $r = Invoke-WebRequest "http://127.0.0.1:8775/$f" -UseBasicParsing
            if ($r.StatusCode -ne 200) { throw "Falta $f en el .exe" }
          }
          Get-Process MonitorPases -ErrorAction SilentlyContinue | Stop-Process -Force  # el .exe de un solo fichero son dos procesos
          if ($html -notmatch "Monitor de pases") { throw "La página no es la del monitor" }
          $mb = [math]::Round((Get-Item dist/MonitorPases.exe).Length / 1MB, 1)
          "MonitorPases.exe $env:VERSION ($mb MB) arranca y sirve la app." | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - uses: actions/upload-artifact@v4
        with:
          name: MonitorPases-${{ env.VERSION }}
          path: monitor-pases/dist/MonitorPases.exe

      - name: Publicar en la release «monitor-pases»
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notas = "Monitor de pases $env:VERSION · commit $($env:GITHUB_SHA.Substring(0,7))`n`nPlugin de VS Code: descarga MonitorPases.vsix y en VS Code, Extensiones → … → Instalar desde VSIX (usa el Python de la VDI). También MonitorPases.exe para quien pueda ejecutarlo. Instrucciones en monitor-pases/README.md."
          gh release view monitor-pases *> $null
          $existe = ($LASTEXITCODE -eq 0)
          if ($existe) {
            gh release upload monitor-pases dist/MonitorPases.exe --clobber
            if ($LASTEXITCODE -ne 0) { throw "No se pudo subir el .exe" }
            gh release edit monitor-pases --title "Monitor de pases $env:VERSION" --notes "$notas"
          } else {
            gh release create monitor-pases dist/MonitorPases.exe --target $env:GITHUB_SHA --title "Monitor de pases $env:VERSION" --notes "$notas" --latest=false
          }
          if ($LASTEXITCODE -ne 0) { throw "No se pudo publicar la release" }

  vsix:
    needs: exe  # la release la crea (o actualiza) el trabajo del .exe
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: monitor-pases/vscode
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"  # el mínimo que pide el plugin: si funciona con 3.8, funciona con el de la VDI

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Empaquetar MonitorPases.vsix
        run: |
          node empaquetar.js
          if ($LASTEXITCODE -ne 0) { throw "No se pudo empaquetar" }
          "VERSION=$((Get-Content package.json -Raw | ConvertFrom-Json).version)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Probar el motor como lo arranca el plugin (desde el .vsix)
        run: |
          Expand-Archive MonitorPases.vsix -DestinationPath $env:RUNNER_TEMP/vsix
          node prueba-motor.js "$env:RUNNER_TEMP/vsix/extension/motor"
          if ($LASTEXITCODE -ne 0) { throw "El motor no arranca desde el .vsix" }

      - name: Probar la extensión (VS Code simulado)
        run: |
          node prueba-extension.js
          if ($LASTEXITCODE -ne 0) { throw "La extensión falla" }
          $kb = [math]::Round((Get-Item MonitorPases.vsix).Length / 1KB)
          "MonitorPases.vsix $env:VERSION ($kb KB): el motor arranca desde el plugin con Python 3.8 y la extensión responde." | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - uses: actions/upload-artifact@v4
        with:
          name: MonitorPases-vsix-${{ env.VERSION }}
          path: monitor-pases/vscode/MonitorPases.vsix

      - name: Publicar en la release «monitor-pases»
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload monitor-pases MonitorPases.vsix --clobber
          if ($LASTEXITCODE -ne 0) { throw "No se pudo subir el .vsix" }
