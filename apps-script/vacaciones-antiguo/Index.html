<!DOCTYPE html>
<html lang="es">
<head>
  <!-- IMPORTANTE: viewport debe ser el primer meta (algunos motores lo
       procesan en orden, especialmente dentro del iframe de Apps Script) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta charset="utf-8">
  <base target="_top">

  <!-- Refuerzo del viewport antes del primer layout.
       Necesario porque el iframe de Apps Script a veces ignora el meta
       viewport estático en algunos móviles. Reescribirlo dinámicamente
       fuerza al motor a recalcular. -->
  <script>
    (function() {
      try {
        var sw = (window.screen && window.screen.width) || 0;
        if (sw > 0 && sw < 900) {
          var mv = document.querySelector('meta[name="viewport"]');
          if (!mv) {
            mv = document.createElement('meta');
            mv.setAttribute('name', 'viewport');
            document.head.appendChild(mv);
          }
          mv.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no');
        }
      } catch (e) {}
    })();
  </script>

  <title>Vacaciones RDR · Panel de aprobaciones</title>

  <!-- Fuentes BBVA -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,700;1,8..60,700&family=Lato:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap" rel="stylesheet">

  <!-- Tooltips -->
  <script src="https://unpkg.com/@popperjs/core@2"></script>
  <script src="https://unpkg.com/tippy.js@6"></script>
  <link rel="stylesheet" href="https://unpkg.com/tippy.js@6/animations/scale.css"/>

  <style>
    /* ===== TOKENS BBVA × NFQ ===== */
    :root {
      --bbva-electric-blue: #001391;
      --bbva-serene-blue:   #85C8FF;
      --bbva-white:    #FFFFFF;
      --bbva-sand:     #F7F8F8;
      --bbva-gray-2:   #E2E6EA;
      --bbva-gray-3:   #CAD1D8;
      --bbva-gray-4:   #ADB8C2;
      --bbva-gray-5:   #46536D;
      --bbva-midnight: #070E46;
      --bbva-canary:   #FFE761;
      --bbva-lime:     #88E783;
      --bbva-aqua:     #8BE1E9;
      --bbva-purple:   #9694FF;
      --bbva-mandarin: #FFB56B;

      --font-display: "Source Serif 4", Georgia, serif;
      --font-body:    "Lato", "Helvetica Neue", Arial, sans-serif;

      --bg-color:      var(--bbva-sand);
      --sidebar-bg:    var(--bbva-white);
      --white:         var(--bbva-white);
      --border-color:  var(--bbva-gray-2);
      --border-light:  #EFF2F4;
      --hover-border:  var(--bbva-gray-3);
      --text-main:     var(--bbva-midnight);
      --text-dark:     var(--bbva-midnight);
      --text-muted:    var(--bbva-gray-5);
      --text-light:    var(--bbva-gray-4);
      --hover-bg:      var(--bbva-sand);
      --blue-main:     var(--bbva-electric-blue);
      --blue-bg:       #E6E8F4;
      --red-alert:     #C53030;
      --more-dots-text: var(--bbva-gray-5);
      --pending-main:  var(--bbva-mandarin);
      --pending-bg:    #FFF3E0;

      --es-bg-1: #DEEEFB; --es-bg-2: #CCE6FA; --es-border: #85C8FF; --es-text: var(--bbva-electric-blue);
      --mx-bg-1: #E6F9E2; --mx-bg-2: #D2F3CB; --mx-border: var(--bbva-lime); --mx-text: #176B12;
      --both-bg-1: #FFF1DE; --both-bg-2: #FFE3BD; --both-border: var(--bbva-mandarin); --both-text: #B45309;

      --motivo-va: var(--bbva-lime);
      --motivo-fo: var(--bbva-serene-blue);
      --motivo-es: var(--bbva-purple);
      --motivo-ba: #C53030;

      --tooltip-bg:    var(--bbva-midnight);
      --tooltip-text:  var(--bbva-sand);
      --tooltip-title: var(--bbva-serene-blue);
      --tooltip-line:  rgba(255,255,255,0.15);

      --radius-lg: 16px;
      --radius-md: 8px;
      --radius-sm: 4px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex; height: 100vh; overflow: hidden;
    }

    /* SIDEBAR */
    #sidebar {
      width: 280px; background-color: var(--sidebar-bg);
      border-right: 1px solid var(--border-color);
      display: flex; flex-direction: column; flex-shrink: 0; z-index: 10;
    }
    #sidebar-header {
      padding: 24px 20px; border-bottom: 1px solid var(--border-light);
      display: flex; flex-direction: column; gap: 12px;
    }
    #sidebar-header .logo-row { display: flex; justify-content: space-between; align-items: center; }
    #sidebar-header h2 {
      font-family: var(--font-display);
      font-size: 1.5rem; font-weight: 700;
      color: var(--bbva-electric-blue);
      letter-spacing: -0.01em; line-height: 1;
    }
    #sidebar-header .logo-bbva { height: 24px; }
    .filter-pill {
      font-size: 0.72rem; color: var(--bbva-electric-blue);
      cursor: pointer; font-weight: 700;
      padding: 6px 12px; border-radius: 9999px;
      background: var(--bbva-sand);
      border: 1px solid var(--bbva-gray-2);
      transition: all 0.18s; align-self: flex-start;
      text-transform: uppercase; letter-spacing: 0.04em;
    }
    .filter-pill:hover { background: var(--bbva-serene-blue); border-color: var(--bbva-serene-blue); }

    #employee-list { flex: 1; overflow-y: auto; padding: 12px; }
    .emp-card {
      display: flex; align-items: center;
      padding: 10px 12px; margin-bottom: 6px;
      border-radius: var(--radius-md);
      background: var(--white);
      border: 1px solid transparent;
      cursor: pointer; transition: all 0.18s ease;
    }
    .emp-card:hover { background: var(--bbva-sand); border-color: var(--bbva-gray-2); }
    .emp-card.dimmed { opacity: 0.4; filter: grayscale(60%); }
    .emp-card.active { border-color: var(--bbva-electric-blue); background-color: var(--blue-bg); }
    .emp-color { width: 10px; height: 10px; border-radius: 50%; margin-right: 12px; flex-shrink: 0; box-shadow: 0 0 0 2px var(--white); }
    .emp-info { flex: 1; overflow: hidden; }
    .emp-name { font-weight: 700; font-size: 0.82rem; color: var(--bbva-midnight); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .emp-name.tachado { text-decoration: line-through; color: var(--text-light); font-weight: 400; }
    .emp-stats { font-size: 0.68rem; color: var(--text-muted); margin-top: 4px; }
    .stat-badge { background: var(--bbva-sand); padding: 2px 6px; border-radius: 4px; margin-right: 4px; border: 1px solid var(--bbva-gray-2); }

    #leyenda { padding: 16px; border-top: 1px solid var(--border-color); font-size: 0.72rem; color: var(--text-muted); }
    .leyenda-item { display: flex; align-items: center; margin-bottom: 8px; color: var(--text-dark); }
    .box-leyenda { width: 14px; height: 14px; margin-right: 10px; border-radius: 3px; border: 1px solid transparent; }
    .leyenda-subtitle {
      font-size: 0.62rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .leyenda-equipo-dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 10px; flex-shrink: 0; }
    #leyenda-equipos:not(:empty) { padding-bottom: 12px; margin-bottom: 12px; border-bottom: 1px solid var(--border-light); }

    /* PANEL SOLICITUDES */
    #requests-panel {
      width: 320px; background-color: var(--sidebar-bg);
      border-left: 1px solid var(--border-color);
      display: flex; flex-direction: column; flex-shrink: 0; z-index: 10;
    }
    #requests-header {
      padding: 24px 20px; border-bottom: 1px solid var(--border-light);
      background: var(--bbva-sand);
    }
    #requests-header h2 {
      font-family: var(--font-display);
      font-size: 1.25rem; font-weight: 700;
      color: var(--bbva-electric-blue);
      margin-bottom: 4px; letter-spacing: -0.01em;
    }
    #requests-header p { font-size: 0.78rem; color: var(--bbva-gray-5); }
    #requests-list { flex: 1; overflow-y: auto; padding: 16px; }

    .req-card {
      background: var(--white); border: 1px solid var(--border-color);
      border-radius: var(--radius-md); padding: 14px; margin-bottom: 12px;
      cursor: pointer; transition: all 0.18s;
    }
    .req-card:hover { border-color: var(--bbva-electric-blue); }
    .req-card.active { border-color: var(--bbva-electric-blue); background-color: var(--blue-bg); border-width: 2px; padding: 13px; }
    .req-name { font-weight: 700; font-size: 0.88rem; color: var(--bbva-midnight); margin-bottom: 4px; }
    .req-dates { font-size: 0.78rem; color: var(--text-dark); margin-bottom: 8px; }
    .req-actions { display: flex; gap: 8px; margin-top: 14px; }

    .btn {
      flex: 1; padding: 8px 10px;
      font-family: var(--font-body);
      font-size: 0.78rem; font-weight: 700;
      border-radius: 9999px; border: none;
      cursor: pointer; transition: all 0.18s;
    }
    .btn-approve { background: var(--bbva-lime); color: var(--bbva-electric-blue); }
    .btn-approve:hover { background: #6FD969; }
    .btn-reject {
      background: transparent; color: var(--bbva-midnight);
      border: 1px solid var(--bbva-gray-4);
    }
    .btn-reject:hover { background: var(--bbva-midnight); color: var(--white); border-color: var(--bbva-midnight); }

    #requests-footer {
      padding: 16px 20px; border-top: 1px solid var(--border-light);
      background: var(--sidebar-bg);
      display: flex; flex-direction: column; gap: 12px;
    }
    .btn-sync {
      width: 100%; background-color: var(--bbva-electric-blue);
      color: var(--bbva-white); border: 0;
      padding: 10px 16px; border-radius: 9999px;
      font-family: var(--font-body); font-size: 0.78rem; font-weight: 700;
      cursor: pointer; transition: background 0.18s;
    }
    .btn-sync:hover { background-color: var(--bbva-midnight); }

    .nfq-credit {
      display: flex; align-items: center; justify-content: center;
      gap: 8px; font-size: 0.65rem; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    .nfq-credit img { height: 14px; width: auto; }

    /* CALENDARIO */
    #main-content { flex: 1; overflow-y: auto; padding: 32px; }
    #calendar-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 24px; max-width: 1400px; margin: 0 auto;
    }
    .month-card { background: var(--white); border-radius: var(--radius-lg); padding: 20px; border: 1px solid var(--bbva-gray-2); }
    .month-card.current-month { border-color: var(--bbva-electric-blue); border-width: 2px; padding: 19px; }
    .month-title {
      font-family: var(--font-display);
      font-size: 1.35rem; font-weight: 700;
      color: var(--bbva-electric-blue);
      margin-bottom: 14px; text-transform: capitalize;
      letter-spacing: -0.01em;
    }
    .weekdays {
      display: grid; grid-template-columns: repeat(7, 1fr);
      text-align: center; font-size: 0.65rem; font-weight: 700;
      color: var(--text-muted); margin-bottom: 8px; padding-bottom: 8px;
      border-bottom: 1px solid var(--border-light); letter-spacing: 0.06em;
    }
    .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .day-cell {
      min-height: 48px; border: 1px solid var(--border-color);
      border-radius: var(--radius-sm); position: relative; padding: 4px;
      background: var(--white); display: flex; flex-direction: column;
    }
    .day-number { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); margin-bottom: 4px; padding-left: 2px; z-index: 2; }
    .day-cell.empty { background: transparent; border-color: transparent; pointer-events: none; }
    .day-cell:not(.empty):not(.holiday-spain):not(.holiday-mexico):not(.holiday-both):hover { background: var(--bbva-sand); border-color: var(--hover-border); }

    .day-cell.today { background-color: var(--blue-bg); border-color: var(--bbva-electric-blue) !important; box-shadow: inset 0 0 0 1px var(--bbva-electric-blue); }
    .day-cell.today .day-number { color: var(--white) !important; background-color: var(--bbva-electric-blue); border-radius: 50%; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; font-weight: 700; }
    .day-cell.holiday-spain { background-image: repeating-linear-gradient(45deg, var(--es-bg-1), var(--es-bg-1) 6px, var(--es-bg-2) 6px, var(--es-bg-2) 12px); border-color: var(--es-border); }
    .day-cell.holiday-spain .day-number { color: var(--es-text); font-weight: 700; }
    .day-cell.holiday-mexico { background-image: repeating-linear-gradient(45deg, var(--mx-bg-1), var(--mx-bg-1) 6px, var(--mx-bg-2) 6px, var(--mx-bg-2) 12px); border-color: var(--mx-border); }
    .day-cell.holiday-mexico .day-number { color: var(--mx-text); font-weight: 700; }
    .day-cell.holiday-both { background-image: repeating-linear-gradient(45deg, var(--both-bg-1), var(--both-bg-1) 6px, var(--both-bg-2) 6px, var(--both-bg-2) 12px); border-color: var(--both-border); }
    .day-cell.holiday-both .day-number { color: var(--both-text); font-weight: 700; }
    .day-cell.weekend { background-color: var(--bbva-sand); }
    .day-cell.alerta-personal::before { content: ''; position: absolute; inset: -1px; border: 2px solid var(--red-alert); border-radius: var(--radius-sm); pointer-events: none; z-index: 5; }

    .day-cell.simulated { background-image: repeating-linear-gradient(45deg, var(--pending-bg), var(--pending-bg) 5px, #fff 5px, #fff 10px); border-color: var(--pending-main) !important; box-shadow: inset 0 0 0 1px var(--pending-main); }
    .dots-container { width: 100%; margin-top: auto; display: flex; flex-wrap: wrap; justify-content: center; gap: 3px; align-items: center; }
    .dot { width: 7px; height: 7px; border-radius: 50%; box-shadow: 0 1px 2px rgba(7,14,70,0.18); }
    .dot.simulated-dot { animation: pulse 1s infinite alternate; }
    .more-dots { font-size: 0.58rem; font-weight: 700; color: var(--more-dots-text); background: var(--bbva-gray-2); border-radius: 4px; padding: 0 4px; height: 11px; display: flex; align-items: center; justify-content: center; }
    @keyframes pulse { from { opacity: 0.4; transform: scale(0.8);} to { opacity: 1; transform: scale(1.2);} }

    /* Tooltips */
    .tippy-box { background-color: var(--tooltip-bg) !important; color: var(--tooltip-text) !important; border-radius: 8px !important; font-family: var(--font-body) !important; padding: 4px; }
    .tippy-arrow { color: var(--tooltip-bg) !important; }
    .tooltip-lista { padding: 8px; min-width: 220px; }

    /* Loader */
    #loader {
      position: fixed; inset: 0;
      background: var(--bbva-sand);
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      z-index: 1000; color: var(--bbva-electric-blue);
      font-family: var(--font-display); font-weight: 700;
    }
    #loader .loader-spinner {
      width: 40px; height: 40px;
      border: 3px solid var(--bbva-gray-2);
      border-top-color: var(--bbva-electric-blue);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loader-text { font-size: 1rem; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: var(--bbva-gray-3); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--bbva-gray-4); }

    /* ========================================================
       MOBILE TOPBAR (oculta en desktop)
       ======================================================== */
    #mobile-topbar {
      display: none;
      position: sticky; top: 0; z-index: 60;
      background: var(--white);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 12px;
      align-items: center; justify-content: space-between; gap: 8px;
      height: 56px;
    }
    .mb-btn {
      background: var(--bbva-sand);
      border: 1px solid var(--bbva-gray-2);
      border-radius: 10px;
      width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; position: relative;
      color: var(--bbva-midnight);
      transition: background 0.15s;
    }
    .mb-btn:active { background: var(--bbva-gray-2); }
    .mb-btn svg { width: 20px; height: 20px; }
    .mb-btn .badge {
      position: absolute; top: -4px; right: -4px;
      min-width: 18px; height: 18px;
      background: var(--bbva-electric-blue);
      color: var(--bbva-white);
      border-radius: 9999px;
      font-size: 0.62rem; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      padding: 0 5px;
      border: 2px solid var(--white);
    }
    #mobile-topbar .mb-title {
      font-family: var(--font-display);
      font-weight: 700;
      color: var(--bbva-electric-blue);
      font-size: 1.05rem;
      letter-spacing: -0.01em;
    }

    /* Overlay para drawers */
    #drawer-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(7, 14, 70, 0.45);
      z-index: 40;
      animation: fadein 0.15s ease;
    }
    @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
    body.drawer-open #drawer-overlay { display: block; }
    body.drawer-open { overflow: hidden; }

    /* ========================================================
       BOTTOM SHEET — detalles del día (uso táctil principalmente)
       ======================================================== */
    #day-sheet {
      position: fixed; left: 0; right: 0; bottom: 0;
      max-height: 70vh;
      background: var(--white);
      border-radius: 20px 20px 0 0;
      transform: translateY(105%);
      transition: transform 0.28s cubic-bezier(0.32, 0.72, 0, 1);
      z-index: 70;
      box-shadow: 0 -8px 30px rgba(7, 14, 70, 0.18);
      display: flex; flex-direction: column;
      padding: 8px 0 16px 0;
    }
    #day-sheet.open { transform: translateY(0); }
    .day-sheet-handle {
      width: 40px; height: 4px;
      background: var(--bbva-gray-3);
      border-radius: 2px;
      margin: 0 auto 8px;
      flex-shrink: 0;
    }
    .day-sheet-head {
      display: flex; align-items: flex-start; justify-content: space-between;
      padding: 8px 20px 16px;
      border-bottom: 1px solid var(--border-light);
      flex-shrink: 0;
    }
    .day-sheet-eyebrow {
      font-size: 0.7rem; font-weight: 700;
      color: var(--bbva-gray-5);
      text-transform: uppercase; letter-spacing: 0.06em;
      margin-bottom: 2px;
    }
    .day-sheet-title {
      font-family: var(--font-display);
      font-size: 1.4rem; font-weight: 700;
      color: var(--bbva-electric-blue);
      letter-spacing: -0.01em;
      text-transform: capitalize;
      line-height: 1.15;
    }
    .day-sheet-close {
      background: var(--bbva-sand);
      border: 1px solid var(--bbva-gray-2);
      border-radius: 50%;
      width: 32px; height: 32px;
      font-size: 16px; line-height: 1;
      color: var(--bbva-midnight);
      cursor: pointer;
      flex-shrink: 0;
    }
    .day-sheet-close:active { background: var(--bbva-gray-2); }
    .day-sheet-list {
      flex: 1; overflow-y: auto;
      padding: 12px 20px 8px;
    }
    .day-sheet-item {
      display: flex; align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-light);
    }
    .day-sheet-item:last-child { border-bottom: 0; }
    .day-sheet-color {
      width: 12px; height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 0 2px var(--white);
    }
    .day-sheet-name {
      flex: 1;
      font-weight: 700; font-size: 0.92rem;
      color: var(--bbva-midnight);
    }
    .day-sheet-tag {
      font-size: 0.62rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.04em;
      padding: 4px 10px;
      border-radius: 9999px;
      flex-shrink: 0;
    }
    /* Hint visual de que las celdas con ausencias son tocables */
    .day-cell.has-people { cursor: pointer; }

    /* ========================================================
       MEDIA QUERY: < 900px (móvil + tablet pequeña)
       ========================================================
       Doble cobertura: `max-width` (mira el viewport) y
       `max-device-width` (mira la pantalla física). El segundo es
       crítico cuando el iframe de Apps Script no propaga bien el
       viewport al móvil.
       ======================================================== */
    @media (max-width: 899px), (max-device-width: 899px) {
      body { flex-direction: column; height: 100vh; overflow: hidden; }

      #mobile-topbar { display: flex; }

      /* Cabeceras de los paneles nunca se comprimen */
      #sidebar-header, #requests-header { flex-shrink: 0; }

      /* Overlay y drawers empiezan DEBAJO del topbar (siempre visible) */
      #drawer-overlay { top: 56px; }

      /* Sidebar izquierdo: off-canvas */
      #sidebar {
        position: fixed; top: 56px; left: 0; bottom: 0;
        width: 85%; max-width: 320px;
        z-index: 50;
        transform: translateX(-100%);
        transition: transform 0.25s ease;
        box-shadow: 0 0 20px rgba(7, 14, 70, 0.15);
      }
      #sidebar.open { transform: translateX(0); }

      /* Panel derecho (bandeja): off-canvas */
      #requests-panel {
        position: fixed; top: 56px; right: 0; bottom: 0;
        width: 88%; max-width: 360px;
        z-index: 50;
        transform: translateX(100%);
        transition: transform 0.25s ease;
        box-shadow: 0 0 20px rgba(7, 14, 70, 0.15);
        border-left: none;
      }
      #requests-panel.open { transform: translateX(0); }

      /* Main content a pantalla completa */
      #main-content {
        flex: 1;
        padding: 16px;
        overflow-y: auto;
        background: var(--bg-color);
        min-height: 0;
      }
      #calendar-grid {
        grid-template-columns: 1fr;
        gap: 16px;
      }
      .month-card { padding: 16px; }
      .month-card.current-month { padding: 15px; }
      .month-title { font-size: 1.2rem; }

      /* Tap targets más grandes */
      .day-cell { min-height: 56px; }
      .day-number { font-size: 0.82rem; }
      .dot { width: 8px; height: 8px; }

      /* Botones más grandes en móvil */
      .btn { min-height: 44px; font-size: 0.85rem; }
      .btn-sync { min-height: 44px; }

      /* Tipografía un punto más legible */
      .emp-name { font-size: 0.9rem; }
      .emp-stats { font-size: 0.74rem; }
      .req-name { font-size: 0.95rem; }
      .req-dates { font-size: 0.84rem; }
      #leyenda { font-size: 0.78rem; }

      /* Loader cubre todo */
      #loader { z-index: 1100; }
    }

    /* Tablet pequeña: ajustes finos */
    @media (max-width: 480px), (max-device-width: 480px) {
      #mobile-topbar { padding: 8px 10px; }
      #mobile-topbar .mb-title { font-size: 0.95rem; }
      .mb-btn { width: 38px; height: 38px; }
      #main-content { padding: 12px; }
      .month-card { padding: 14px; }
      .month-title { font-size: 1.1rem; margin-bottom: 10px; }
      .day-cell { min-height: 52px; padding: 3px; }
      .weekdays { font-size: 0.6rem; }
    }

    /* ========================================================
       FALLBACK PARA APPS SCRIPT (iframe quirks en móvil)
       ========================================================
       Cuando Apps Script sirve este HTML dentro de un iframe en
       googleusercontent.com, en algunos móviles las @media queries
       de arriba no se activan porque el iframe no propaga bien el
       viewport. Estas mismas reglas se duplican aquí bajo una clase
       que añade el JS al detectar screen.width < 900.
       Si las @media YA funcionan, estas reglas producen exactamente
       lo mismo: no hay conflicto.
       ======================================================== */
    body.mobile-layout { flex-direction: column; height: 100vh; overflow: hidden; }
    body.mobile-layout #mobile-topbar { display: flex; }
    body.mobile-layout #sidebar-header,
    body.mobile-layout #requests-header { flex-shrink: 0; }
    body.mobile-layout #drawer-overlay { top: 56px; }

    body.mobile-layout #sidebar {
      position: fixed; top: 56px; left: 0; bottom: 0;
      width: 85%; max-width: 320px;
      z-index: 50;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      box-shadow: 0 0 20px rgba(7, 14, 70, 0.15);
    }
    body.mobile-layout #sidebar.open { transform: translateX(0); }

    body.mobile-layout #requests-panel {
      position: fixed; top: 56px; right: 0; bottom: 0;
      width: 88%; max-width: 360px;
      z-index: 50;
      transform: translateX(100%);
      transition: transform 0.25s ease;
      box-shadow: 0 0 20px rgba(7, 14, 70, 0.15);
      border-left: none;
    }
    body.mobile-layout #requests-panel.open { transform: translateX(0); }

    body.mobile-layout #main-content {
      flex: 1; padding: 16px;
      overflow-y: auto; background: var(--bg-color);
      min-height: 0;
    }
    body.mobile-layout #calendar-grid { grid-template-columns: 1fr; gap: 16px; }
    body.mobile-layout .month-card { padding: 16px; }
    body.mobile-layout .month-card.current-month { padding: 15px; }
    body.mobile-layout .month-title { font-size: 1.2rem; }
    body.mobile-layout .day-cell { min-height: 56px; }
    body.mobile-layout .day-number { font-size: 0.82rem; }
    body.mobile-layout .dot { width: 8px; height: 8px; }
    body.mobile-layout .btn { min-height: 44px; font-size: 0.85rem; }
    body.mobile-layout .btn-sync { min-height: 44px; }
    body.mobile-layout .emp-name { font-size: 0.9rem; }
    body.mobile-layout .emp-stats { font-size: 0.74rem; }
    body.mobile-layout .req-name { font-size: 0.95rem; }
    body.mobile-layout .req-dates { font-size: 0.84rem; }
    body.mobile-layout #leyenda { font-size: 0.78rem; }
    body.mobile-layout #loader { z-index: 1100; }

    body.xs-layout #mobile-topbar { padding: 8px 10px; }
    body.xs-layout #mobile-topbar .mb-title { font-size: 0.95rem; }
    body.xs-layout .mb-btn { width: 38px; height: 38px; }
    body.xs-layout #main-content { padding: 12px; }
    body.xs-layout .month-card { padding: 14px; }
    body.xs-layout .month-title { font-size: 1.1rem; margin-bottom: 10px; }
    body.xs-layout .day-cell { min-height: 52px; padding: 3px; }
    body.xs-layout .weekdays { font-size: 0.6rem; }
  </style>
</head>
<body>

  <div id="loader">
    <div class="loader-spinner"></div>
    <div id="loader-text">Sincronizando datos…</div>
  </div>

  <!-- ─────────── TOPBAR MÓVIL (oculta en desktop) ─────────── -->
  <div id="mobile-topbar">
    <button class="mb-btn" id="btn-open-sidebar" aria-label="Abrir equipo" title="Equipo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <span class="mb-title">Vacaciones RDR</span>
    <button class="mb-btn" id="btn-open-requests" aria-label="Abrir bandeja" title="Bandeja de solicitudes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
      <span class="badge" id="badge-pendientes" style="display:none;">0</span>
    </button>
  </div>

  <!-- Overlay para drawers móviles -->
  <div id="drawer-overlay"></div>

  <!-- Bottom sheet de día (móvil): aparece al tocar un día con ausencias -->
  <div id="day-sheet">
    <div class="day-sheet-handle"></div>
    <div class="day-sheet-head">
      <div>
        <div class="day-sheet-eyebrow" id="day-sheet-eyebrow">—</div>
        <h3 class="day-sheet-title" id="day-sheet-title">—</h3>
      </div>
      <button class="day-sheet-close" id="day-sheet-close" aria-label="Cerrar">✕</button>
    </div>
    <div class="day-sheet-list" id="day-sheet-list"></div>
  </div>

  <div id="sidebar">
    <div id="sidebar-header">
      <div class="logo-row">
        <h2>Equipo</h2>
        <!-- Logo BBVA inline (placeholder por simplicidad — usa el del Drive de Apps Script si quieres) -->
        <span style="font-family: var(--font-display); font-weight: 700; color: var(--bbva-electric-blue); font-size: 1rem; letter-spacing: 0.02em;">BBVA</span>
      </div>
      <span class="filter-pill" onclick="seleccionarEmpleado(null)">Quitar filtros</span>
    </div>
    <div id="employee-list"></div>

    <div id="leyenda">
      <div id="leyenda-equipos"></div>
      <div class="leyenda-item"><div class="box-leyenda" style="background-image: repeating-linear-gradient(45deg, var(--es-bg-1), var(--es-bg-1) 6px, var(--es-bg-2) 6px, var(--es-bg-2) 12px); border-color: var(--es-border);"></div> Festivo España</div>
      <div class="leyenda-item"><div class="box-leyenda" style="background-image: repeating-linear-gradient(45deg, var(--mx-bg-1), var(--mx-bg-1) 6px, var(--mx-bg-2) 6px, var(--mx-bg-2) 12px); border-color: var(--mx-border);"></div> Festivo México</div>
      <div class="leyenda-item"><div class="box-leyenda" style="background-image: repeating-linear-gradient(45deg, var(--both-bg-1), var(--both-bg-1) 6px, var(--both-bg-2) 6px, var(--both-bg-2) 12px); border-color: var(--both-border);"></div> Festivo común</div>
      <div class="leyenda-item"><div class="box-leyenda" style="border: 2px solid var(--red-alert); background: transparent;"></div> Alerta: &lt;10 disp.</div>
    </div>
  </div>

  <div id="main-content">
    <div id="calendar-grid"></div>
  </div>

  <div id="requests-panel">
    <div id="requests-header">
      <h2>Bandeja de entrada</h2>
      <p id="req-count">0 pendientes</p>
    </div>

    <div id="requests-list"></div>

    <div id="requests-footer">
      <button class="btn-sync" onclick="ejecutarSincronizacion()">Sincronizar Excel principal</button>
      <div class="nfq-credit">
        <span>Hecho por NFQ</span>
      </div>
    </div>
  </div>

  <script>
    let datosGlobales = null;
    let filtrosSeleccionados = new Set();
    let solicitudesSeleccionadas = new Set();
    let totalActivos = 0;

    const mesesNombres = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
    const diasSemana = ['LUN', 'MAR', 'MIÉ', 'JUE', 'VIE', 'SÁB', 'DOM'];

    const diccionarioMotivos = {
      'VA': { texto: 'Vacaciones',    bg: 'var(--motivo-va)', textColor: 'var(--bbva-electric-blue)' },
      'FO': { texto: 'Formación',     bg: 'var(--motivo-fo)', textColor: 'var(--bbva-electric-blue)' },
      'ES': { texto: 'Permiso esp.',  bg: 'var(--motivo-es)', textColor: 'var(--bbva-electric-blue)' },
      'BA': { texto: 'Baja',          bg: 'var(--motivo-ba)', textColor: '#ffffff' }
    };

    window.onload = function() {
      inicializarMobileUI();
      recargarDatos();
    };

    /* ====== MOBILE UI (drawers off-canvas) ====== */
    function inicializarMobileUI() {
      // Fix para Apps Script iframe en móvil: forzar el meta viewport runtime
      // por si el iframe no lo respeta. screen.width siempre devuelve el ancho
      // real de la pantalla física, no del iframe.
      try {
        if (screen && screen.width && screen.width < 900) {
          let mv = document.querySelector('meta[name="viewport"]');
          if (!mv) {
            mv = document.createElement('meta');
            mv.name = 'viewport';
            document.head.appendChild(mv);
          }
          mv.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no');
        }
      } catch (e) { /* algunos entornos no exponen screen, no pasa nada */ }

      // Aplicar clase mobile-layout / xs-layout al body.
      // Esto es un fallback para cuando las @media queries CSS no se activan
      // (problema conocido del iframe de Apps Script en algunos móviles).
      aplicarLayoutMovil();
      reaplicarConRetardos();  // por si el iframe tarda en estabilizar
      window.addEventListener('resize', aplicarLayoutMovil);
      window.addEventListener('orientationchange', aplicarLayoutMovil);

      const btnLeft  = document.getElementById('btn-open-sidebar');
      const btnRight = document.getElementById('btn-open-requests');
      const overlay  = document.getElementById('drawer-overlay');

      if (btnLeft)  btnLeft.addEventListener('click', () => toggleDrawer('left'));
      if (btnRight) btnRight.addEventListener('click', () => toggleDrawer('right'));
      if (overlay)  overlay.addEventListener('click', cerrarDrawers);

      // Cerrar bottom sheet con el botón ✕
      const btnCloseSheet = document.getElementById('day-sheet-close');
      if (btnCloseSheet) btnCloseSheet.addEventListener('click', cerrarDaySheet);

      // Tecla Escape también cierra
      document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarDrawers(); });
    }

    function aplicarLayoutMovil() {
      // Señales de "es móvil" — cualquiera basta:
      //  1) window.innerWidth (el más fiable cuando viewport está bien)
      //  2) screen.width (siempre devuelve el ancho físico de la pantalla)
      //  3) matchMedia con pointer:coarse (dispositivo touch sin precisión fina)
      //  4) UA con 'Mobi' (último recurso)
      var wW = window.innerWidth || 9999;
      var sW = (window.screen && window.screen.width) || 9999;
      var coarse = false;
      try { coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches; } catch (e) {}
      var uaMobi = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent || '');
      var dpr = window.devicePixelRatio || 1;

      var ancho = Math.min(wW, sW);
      var esMovil = ancho < 900 || (coarse && Math.min(wW, sW) < 1024) || uaMobi;
      var esXs    = ancho < 480 || (uaMobi && ancho < 600);

      document.body.classList.toggle('mobile-layout', esMovil);
      document.body.classList.toggle('xs-layout', esXs);

      // Fallback ofensivo: si el iframe está "mintiendo" (innerWidth ancho
      // pero screen estrecho), aplicamos `zoom` CSS al documentElement.
      // Por qué `zoom` y no `max-width`: el navegador móvil escalará todo
      // el viewport del iframe (ancho 980) a la pantalla física (393),
      // reduciendo el contenido al 40 %. Si limitamos el body a 393 con
      // max-width, el contenido se renderiza a 393 dentro del viewport
      // de 980 (queda apretado a la izquierda con hueco blanco a la
      // derecha) y luego se reduce al 40 % → se ve tiny.
      // Con `zoom: ratio` (donde ratio = wW/sW), agrandamos visualmente
      // el contenido para que ocupe los 980 del viewport del iframe; el
      // navegador móvil luego lo escala a 393 físicos y queda a tamaño
      // correcto, ocupando todo el ancho.
      if (sW < 900 && wW > sW + 50) {
        var ratio = wW / sW;
        document.documentElement.style.zoom = ratio;
      } else {
        document.documentElement.style.zoom = '';
      }
    }

    // Re-ejecutar la detección varias veces tras el load por si el
    // iframe tarda en estabilizar el viewport (caso típico de Apps Script
    // en algunos móviles): los primeros ciclos pueden dar valores raros
    // que se corrigen tras 1-3 segundos.
    function reaplicarConRetardos() {
      [100, 500, 1500, 3000].forEach(function(ms) {
        setTimeout(aplicarLayoutMovil, ms);
      });
    }

    function toggleDrawer(lado) {
      const el = document.getElementById(lado === 'left' ? 'sidebar' : 'requests-panel');
      if (!el) return;
      if (el.classList.contains('open')) cerrarDrawers();
      else abrirDrawer(lado);
    }
    function abrirDrawer(lado) {
      cerrarDrawers();
      const el = document.getElementById(lado === 'left' ? 'sidebar' : 'requests-panel');
      if (el) el.classList.add('open');
      document.body.classList.add('drawer-open');
    }
    function cerrarDrawers() {
      document.getElementById('sidebar')?.classList.remove('open');
      document.getElementById('requests-panel')?.classList.remove('open');
      document.getElementById('day-sheet')?.classList.remove('open');
      document.body.classList.remove('drawer-open');
    }
    function _esMovil() {
      // Misma lógica de detección — usada para auto-cerrar drawers
      const wW = window.innerWidth || 9999;
      const sW = (window.screen && window.screen.width) || 9999;
      return Math.min(wW, sW) < 900;
    }
    function _autoCloseOnMobile() { if (_esMovil()) cerrarDrawers(); }

    // ¿Dispositivo táctil? Determina si usamos bottom sheet (tap) o
    // tippy tooltip (hover) para los detalles de cada día.
    const ES_TOUCH = ('ontouchstart' in window) ||
                     (navigator.maxTouchPoints && navigator.maxTouchPoints > 0);

    /* ====== BOTTOM SHEET — detalles del día ====== */
    const NOMBRES_DIA = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];

    function _formatearFechaLegible(dateStr) {
      const partes = dateStr.split('-');
      const d = new Date(parseInt(partes[0]), parseInt(partes[1]) - 1, parseInt(partes[2]));
      return NOMBRES_DIA[d.getDay()] + ' ' + parseInt(partes[2]) + ' de ' + mesesNombres[parseInt(partes[1]) - 1].toLowerCase();
    }

    function abrirDaySheet(dateStr, ausencias) {
      const num = ausencias.length;
      document.getElementById('day-sheet-eyebrow').textContent =
        num + (num === 1 ? ' persona ausente' : ' personas ausentes');
      document.getElementById('day-sheet-title').textContent = _formatearFechaLegible(dateStr);

      const list = document.getElementById('day-sheet-list');
      list.innerHTML = ausencias.map(function(a) {
        const emp = datosGlobales.empleadosMap[a.nombre];
        const motivo = diccionarioMotivos[a.motivo] || { texto: a.motivo, bg: 'var(--bbva-gray-5)', textColor: '#fff' };
        const tachado = (emp && emp.activo) ? '' : 'text-decoration: line-through; opacity: 0.6;';
        return '<div class="day-sheet-item">' +
                 '<div class="day-sheet-color" style="background: ' + ((emp && emp.color) || 'var(--bbva-serene-blue)') + '"></div>' +
                 '<div class="day-sheet-name" style="' + tachado + '">' + (a.nombre || '') + '</div>' +
                 '<span class="day-sheet-tag" style="background: ' + motivo.bg + '; color: ' + motivo.textColor + ';">' + motivo.texto + '</span>' +
               '</div>';
      }).join('');

      document.getElementById('day-sheet').classList.add('open');
      document.body.classList.add('drawer-open');
    }

    function cerrarDaySheet() {
      document.getElementById('day-sheet').classList.remove('open');
      // No quitamos drawer-open si hay otro panel abierto
      if (!document.querySelector('#sidebar.open, #requests-panel.open')) {
        document.body.classList.remove('drawer-open');
      }
    }

    function actualizarBadgePendientes(n) {
      const b = document.getElementById('badge-pendientes');
      if (!b) return;
      if (n > 0) {
        b.textContent = n > 99 ? '99+' : String(n);
        b.style.display = 'flex';
      } else {
        b.style.display = 'none';
      }
    }

    function recargarDatos() {
      document.getElementById('loader-text').innerText = 'Sincronizando datos…';
      document.getElementById('loader').style.display = 'flex';
      google.script.run
        .withSuccessHandler(iniciarDashboard)
        .withFailureHandler(err => alert("Error: " + err.message))
        .obtenerDatosCompletos();
    }

    function iniciarDashboard(datos) {
      if(datos.error) return alert("Error del servidor: " + datos.error);
      document.getElementById('loader').style.display = 'none';

      datosGlobales = datos;
      totalActivos = datos.empleados.length;

      if (!datos.isResponsable) {
        // Mensaje explícito en lugar de ocultar silenciosamente.
        // Esto es la causa #1 de "no veo la bandeja en el móvil":
        // el navegador móvil tiene una sesión Google distinta a la
        // que el usuario espera.
        var nfqMail = (datos.emailDetectado || '').toLowerCase();
        var aviso = document.createElement('div');
        aviso.style.cssText =
          'position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);' +
          'background: var(--bbva-white); border: 2px solid var(--bbva-electric-blue);' +
          'border-radius: var(--radius-lg); padding: 24px; max-width: 90%; width: 360px;' +
          'box-shadow: 0 10px 40px rgba(7,14,70,0.25); z-index: 800;' +
          'font-family: var(--font-body); color: var(--bbva-midnight);';
        aviso.innerHTML =
          '<h3 style="font-family: var(--font-display); font-size: 1.2rem; color: var(--bbva-electric-blue); margin-bottom: 12px;">No te identifico como responsable</h3>' +
          '<p style="font-size: 0.9rem; line-height: 1.5; margin-bottom: 14px;">Estás identificado en Google como:</p>' +
          '<p style="background: var(--bbva-sand); padding: 10px 14px; border-radius: 8px; font-family: monospace; font-size: 0.85rem; margin-bottom: 14px; word-break: break-all;"><b>' + (nfqMail || '(sin sesión Google)') + '</b></p>' +
          '<p style="font-size: 0.85rem; line-height: 1.5; color: var(--bbva-gray-5);">' +
            'Para aprobar solicitudes necesitas estar logueado con tu cuenta corporativa y estar en la hoja <code>RDR</code> con rol 1 o 2.<br><br>' +
            'En móvil, abre la app en Chrome con tu cuenta @nfq.es activa, o usa una pestaña incógnito y loguéate.' +
          '</p>';
        document.body.appendChild(aviso);

        document.getElementById('requests-panel').style.display = 'none';
        const btnR = document.getElementById('btn-open-requests');
        if (btnR) btnR.style.display = 'none';
      }

      datosGlobales.empleados.sort((a, b) => {
        if (a.activo === b.activo) return a.nombre.localeCompare(b.nombre);
        return a.activo ? -1 : 1;
      });

      renderizarSidebar();
      renderizarSolicitudes();
      renderizarLeyendaEquipos();
      renderizarCalendario();
    }

    function renderizarLeyendaEquipos() {
      const cont = document.getElementById('leyenda-equipos');
      cont.innerHTML = '';
      const paleta = datosGlobales.paletaEquipos || {};
      // Recoger equipos que realmente están en uso (algún empleado los tiene)
      const enUso = new Set(
        datosGlobales.empleados
          .map(e => e.equipo)
          .filter(eq => eq && paleta[eq])
      );
      if (enUso.size === 0) return;

      // Subtítulo
      cont.innerHTML = '<div class="leyenda-subtitle">Equipos</div>';
      // Ordenar numéricamente
      Array.from(enUso).sort((a, b) => parseInt(a) - parseInt(b)).forEach(num => {
        const item = document.createElement('div');
        item.className = 'leyenda-item';
        item.innerHTML = `<div class="leyenda-equipo-dot" style="background:${paleta[num]}"></div> Equipo ${num}`;
        cont.appendChild(item);
      });
    }

    function enviarDecision(idSolicitud, accion) {
      document.getElementById('loader-text').innerText = accion === 'APROBAR' ? 'Aprobando solicitud…' : 'Rechazando solicitud…';
      document.getElementById('loader').style.display = 'flex';

      google.script.run
        .withSuccessHandler(res => {
          if (res.success) {
            solicitudesSeleccionadas.delete(idSolicitud);
            _autoCloseOnMobile();
            recargarDatos();
          } else {
            alert("Hubo un error: " + res.message);
            document.getElementById('loader').style.display = 'none';
          }
        })
        .procesarSolicitud(idSolicitud, accion);
    }

    function renderizarSidebar() {
      const contenedor = document.getElementById('employee-list');
      contenedor.innerHTML = '';
      datosGlobales.empleados.forEach(emp => {
        const card = document.createElement('div');
        card.className = 'emp-card';
        card.setAttribute('data-nombre', emp.nombre);
        card.onclick = () => seleccionarEmpleado(emp.nombre);

        if (filtrosSeleccionados.size > 0) {
          if (filtrosSeleccionados.has(emp.nombre)) card.classList.add('active');
          else card.classList.add('dimmed');
        }

        card.innerHTML = `
          <div class="emp-color" style="background-color: ${emp.color}"></div>
          <div class="emp-info">
            <div class="emp-name ${emp.activo ? '' : 'tachado'}">${emp.nombre}</div>
            <div class="emp-stats">
              ${emp.equipo ? `<span class="stat-badge">Eq. <b>${emp.equipo}</b></span>` : ''}
              <span class="stat-badge">Cons: <b>${emp.consumidas}</b></span>
              <span class="stat-badge">Pend: <b>${emp.pendientes}</b></span>
            </div>
          </div>`;
        contenedor.appendChild(card);
      });
    }

    function renderizarSolicitudes() {
      const contenedor = document.getElementById('requests-list');
      contenedor.innerHTML = '';
      const numSols = datosGlobales.solicitudes.length;
      document.getElementById('req-count').innerText = `${numSols} pendientes`;
      actualizarBadgePendientes(datosGlobales.isResponsable ? numSols : 0);

      if (numSols === 0) {
        contenedor.innerHTML = '<p style="font-size:0.82rem; color:var(--bbva-gray-5); text-align:center; margin-top:24px;">Todo al día.</p>';
        return;
      }

      datosGlobales.solicitudes.forEach(sol => {
        const card = document.createElement('div');
        card.className = 'req-card';
        if (solicitudesSeleccionadas.has(sol.id)) card.classList.add('active');

        card.onclick = (e) => {
          if(e.target.tagName === 'BUTTON') return;
          if (solicitudesSeleccionadas.has(sol.id)) solicitudesSeleccionadas.delete(sol.id);
          else solicitudesSeleccionadas.add(sol.id);
          renderizarSolicitudes();
          renderizarCalendario();
        };

        card.innerHTML = `
          <div class="req-name">${sol.nombre}</div>
          <div class="req-dates">Del ${sol.inicioStr} al ${sol.finStr}</div>
          <div style="font-size:0.72rem; color:var(--bbva-gray-5);">Motivo: ${sol.tipo}</div>
          <div class="req-actions">
            <button class="btn btn-approve" onclick="enviarDecision('${sol.id}', 'APROBAR')">Aprobar</button>
            <button class="btn btn-reject" onclick="enviarDecision('${sol.id}', 'RECHAZAR')">Rechazar</button>
          </div>
        `;
        contenedor.appendChild(card);
      });
    }

    function ejecutarSincronizacion() {
      document.getElementById('loader-text').innerText = 'Extrayendo datos del Excel principal…';
      document.getElementById('loader').style.display = 'flex';

      google.script.run
        .withSuccessHandler(res => {
          if (res.success) {
            recargarDatos();
          } else {
            alert("Error al sincronizar: " + res.message);
            document.getElementById('loader').style.display = 'none';
          }
        })
        .withFailureHandler(err => {
          alert("Error crítico: " + err.message);
          document.getElementById('loader').style.display = 'none';
        })
        .forzarSincronizacionWeb();
    }

    function seleccionarEmpleado(nombre) {
      if (nombre === null) {
        filtrosSeleccionados.clear();
        _autoCloseOnMobile();  // cerrar drawer tras "Quitar filtros" para ver el calendario
      } else {
        if (filtrosSeleccionados.has(nombre)) filtrosSeleccionados.delete(nombre);
        else filtrosSeleccionados.add(nombre);
      }
      renderizarSidebar();
      renderizarCalendario();
    }

    function crearFechaDesdeStr(str) { const p = str.split('-'); return new Date(p[0], p[1]-1, p[2]); }
    function fechaEnRango(strFecha, inicioStr, finStr) {
      const f = crearFechaDesdeStr(strFecha);
      const i = crearFechaDesdeStr(inicioStr);
      const f2 = crearFechaDesdeStr(finStr);
      return f >= i && f <= f2;
    }

    function renderizarCalendario() {
      const contenedor = document.getElementById('calendar-grid');
      contenedor.innerHTML = '';

      const anio = datosGlobales.year || new Date().getFullYear();
      const hoy = new Date();
      const strHoy = `${hoy.getFullYear()}-${String(hoy.getMonth() + 1).padStart(2, '0')}-${String(hoy.getDate()).padStart(2, '0')}`;

      let simulacionesActivas = datosGlobales.solicitudes.filter(s => solicitudesSeleccionadas.has(s.id));

      for (let mes = 0; mes < 12; mes++) {
        const monthCard = document.createElement('div');
        monthCard.className = 'month-card';

        let htmlCabecera = `<div class="month-title">${mesesNombres[mes]}</div><div class="weekdays">`;
        diasSemana.forEach(dia => htmlCabecera += `<div>${dia}</div>`);
        htmlCabecera += `</div><div class="days">`;
        monthCard.innerHTML = htmlCabecera;
        const gridDOM = monthCard.querySelector('.days');

        const primerDia = new Date(anio, mes, 1);
        const ultDia = new Date(anio, mes + 1, 0);
        let offset = primerDia.getDay() - 1; if (offset === -1) offset = 6;

        for (let i = 0; i < offset; i++) {
          const empty = document.createElement('div'); empty.className = 'day-cell empty'; gridDOM.appendChild(empty);
        }

        let contieneHoy = false;

        for (let dia = 1; dia <= ultDia.getDate(); dia++) {
          const fechaObj = new Date(anio, mes, dia);
          const dateStr = `${anio}-${String(mes + 1).padStart(2, '0')}-${String(dia).padStart(2, '0')}`;

          const cell = document.createElement('div'); cell.className = 'day-cell';
          cell.innerHTML = `<span class="day-number">${dia}</span>`;

          if (dateStr === strHoy) { cell.classList.add('today'); contieneHoy = true; }
          const isWeekend = fechaObj.getDay() === 0 || fechaObj.getDay() === 6;
          if (isWeekend) cell.classList.add('weekend');

          const festivo = datosGlobales.festivos[dateStr];
          if (festivo === 'ES') cell.classList.add('holiday-spain');
          else if (festivo === 'MX') cell.classList.add('holiday-mexico');
          else if (festivo === 'AMBOS') cell.classList.add('holiday-both');

          let ausencias = Array.from(datosGlobales.ausenciasPorDia[dateStr] || []);

          let esSimulado = false;
          simulacionesActivas.forEach(sim => {
            if (fechaEnRango(dateStr, sim.inicioStr, sim.finStr)) {
              esSimulado = true;
              let tipoCorto = sim.tipo.includes('VA') ? 'VA' : (sim.tipo.includes('FO') ? 'FO' : 'ES');
              ausencias.push({ nombre: sim.nombre, motivo: tipoCorto, simulado: true });
            }
          });

          if (esSimulado && !isWeekend && !festivo) cell.classList.add('simulated');

          let ausenciasMostrar = ausencias;
          if (filtrosSeleccionados.size > 0) {
            ausenciasMostrar = ausencias.filter(a => filtrosSeleccionados.has(a.nombre) || a.simulado);
          }

          const disponibles = totalActivos - ausencias.length;
          if (disponibles < 10 && !isWeekend && !festivo) cell.classList.add('alerta-personal');

          if (ausenciasMostrar.length > 0) {
            const dotsContainer = document.createElement('div');
            dotsContainer.className = 'dots-container';
            const MAX_DOTS = 8;

            let arrPuntos = ausenciasMostrar.slice(0, MAX_DOTS);
            arrPuntos.forEach(a => {
              const color = datosGlobales.empleadosMap[a.nombre]?.color || 'var(--bbva-mandarin)';
              const simClass = a.simulado ? 'simulated-dot' : '';
              dotsContainer.innerHTML += `<div class="dot ${simClass}" style="background-color:${color}"></div>`;
            });

            if (ausenciasMostrar.length > MAX_DOTS) dotsContainer.innerHTML += `<div class="more-dots">+${ausenciasMostrar.length - MAX_DOTS}</div>`;
            cell.appendChild(dotsContainer);

            if (ES_TOUCH) {
              // Móvil: tap abre el bottom sheet con la lista de ausentes
              cell.classList.add('has-people');
              const ausCapturadas = ausenciasMostrar.slice();
              const fechaCapturada = dateStr;
              cell.onclick = function(e) {
                e.stopPropagation();
                abrirDaySheet(fechaCapturada, ausCapturadas);
              };
            } else {
              // Desktop: tooltip con hover (comportamiento original)
              let tooltipHtml = `<div class="tooltip-lista"><strong style="color:var(--tooltip-title); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.04em;">Ausencias (${ausenciasMostrar.length})</strong><hr style="margin:8px 0; border:0; border-top:1px solid var(--tooltip-line);">`;
              ausenciasMostrar.forEach(a => {
                const emp = datosGlobales.empleadosMap[a.nombre];
                const propMotivo = diccionarioMotivos[a.motivo] || { texto: a.motivo, bg: 'var(--bbva-gray-5)', textColor: '#fff' };
                const nameStyle = emp && emp.activo ? '' : 'text-decoration:line-through;opacity:0.6;';
                tooltipHtml += `
                  <div style="display:flex; justify-content:space-between; margin-bottom:8px; gap:14px; align-items:center;">
                    <div style="display:flex; align-items:center; gap:8px;">
                      <div style="width:8px; height:8px; border-radius:50%; background:${emp?.color || 'var(--bbva-serene-blue)'}"></div>
                      <span style="font-size:0.82rem; color:var(--tooltip-text); ${nameStyle}">${emp?.nombre || a.nombre}</span>
                    </div>
                    <span style="font-size:0.62rem; padding:3px 8px; border-radius:9999px; text-transform:uppercase; font-weight:700; letter-spacing:0.04em; background-color:${propMotivo.bg}; color:${propMotivo.textColor};">${propMotivo.texto}</span>
                  </div>`;
              });
              tooltipHtml += '</div>';

              cell._tippyHtml = tooltipHtml;
              cell.classList.add('has-tooltip');
            }
          }
          gridDOM.appendChild(cell);
        }

        if (contieneHoy) monthCard.classList.add('current-month');
        contenedor.appendChild(monthCard);
      }

      if (window.misTooltips) window.misTooltips.forEach(t => t.destroy());
      if (!ES_TOUCH) {
        window.misTooltips = tippy('.has-tooltip', {
          content: (reference) => reference._tippyHtml,
          allowHTML: true,
          placement: 'top',
          appendTo: document.body,
          animation: 'scale',
          interactive: true,
          maxWidth: 320
        });
      }
    }
  </script>
</body>
